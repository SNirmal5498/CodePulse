name: CodePulse CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  authentication-ci:
    name: Authentication CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codepulse
          POSTGRES_USER: codepulse_user
          POSTGRES_PASSWORD: codepulse_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codepulse_user -d codepulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USERNAME: codepulse_user
      DB_PASSWORD: codepulse_ci_password
      JWT_SECRET: CodePulse_CI_JWT_Secret_2026_TestOnly

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Backend Build
      - name: Backend Build
        working-directory: server
        run: mvn clean package -DskipTests

      # 4. Backend Test
      - name: Backend Test
        working-directory: server
        run: mvn test

      # 5. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # 6. Frontend Install
      - name: Frontend Install Dependencies
        working-directory: client
        run: npm ci

      # 7. Frontend Test
      - name: Frontend Test
        working-directory: client
        run: npm test -- --run

      # 8. Frontend Build
      - name: Frontend Build
        working-directory: client
        run: npm run build